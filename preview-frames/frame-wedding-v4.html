<script>
  /* ── Đọc params từ URL ── */
  function getParams() {
    var p = new URLSearchParams(window.location.search);
    return {
      day:        p.get('day')        || '19',
      month:      p.get('month')      || '9',
      year:       p.get('year')       || '2023',
      pair_left:  p.get('pair_left')  || p.get('pairLeft')  || 'Ba',
      pair_right: p.get('pair_right') || p.get('pairRight') || 'Mẹ',
      photo_url:  p.get('photo_url')  || p.get('photoUrl')  || ''
    };
  }

  var data = getParams();

  function pad(n) { return n < 10 ? '0' + n : String(n); }

  function parseSheetDate(d, m, y) {
    var dd = parseInt(d, 10);
    var mm = parseInt(m, 10);
    var yy = parseInt(y, 10);
    if (isNaN(dd) || isNaN(mm) || isNaN(yy))
      return { ok: false, msg: 'Ngày/tháng/năm không hợp lệ' };
    if (mm < 1 || mm > 12)
      return { ok: false, msg: 'Tháng phải từ 1 đến 12' };
    if (dd < 1 || dd > 31)
      return { ok: false, msg: 'Ngày phải từ 1 đến 31' };
    if (yy < 1900 || yy > 2100)
      return { ok: false, msg: 'Năm không hợp lý (' + yy + ')' };
    var probe = new Date(yy, mm - 1, dd);
    if (probe.getMonth() !== mm - 1 || probe.getDate() !== dd)
      return { ok: false, msg: pad(dd) + '/' + pad(mm) + '/' + yy + ' không tồn tại' };
    return { ok: true, day: dd, month: mm, year: yy };
  }

  (function render() {
    var result = parseSheetDate(data.day, data.month, data.year);
    if (!result.ok) {
      document.getElementById('ev-n').textContent    = '--';
      document.getElementById('ev-pair').textContent = '⚠ Lỗi dữ liệu';
      document.getElementById('ev-range').textContent = result.msg;
      return;
    }

    var currentYear = new Date().getFullYear();
    var N = Math.max(0, currentYear - result.year);
    var weddingDate    = pad(result.day) + '/' + pad(result.month) + '/' + result.year;
    var anniversaryDate = pad(result.day) + '/' + pad(result.month) + '/' + currentYear;

    var nameL = (data.pair_left  && data.pair_left.trim())  ? data.pair_left.trim()  : '---';
    var nameR = (data.pair_right && data.pair_right.trim()) ? data.pair_right.trim() : '---';

    if (data.photo_url && data.photo_url.trim() !== '')
      document.getElementById('ev-photo').src = data.photo_url;

    document.getElementById('ev-n').textContent = N;
    document.getElementById('ev-pair').innerHTML =
      nameL + '<span class="heart">\u2665</span>' + nameR;
    document.getElementById('ev-range').textContent =
      weddingDate + ' \u2013 ' + anniversaryDate;
  })();
</script>
