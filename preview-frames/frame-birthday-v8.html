        </div>
        <div class="decor-cluster" aria-hidden="true">
          <img class="dec flower-l" src="assets/decor-flower-a.png" alt=""
               onerror="this.style.display='none'" />
          <img class="dec cake"     src="assets/decor-cake.png"     alt=""
               onerror="this.style.display='none'" />

      <div class="col-text">
        <p class="line1">Chúc mừng sinh nhật</p>

        <div class="divider" aria-hidden="true">
          <span class="div-line"></span>
          <span class="div-dot"></span>
          <span class="div-line"></span>
        </div>

        <p class="name"        id="ev-name">An Nhiên</p>
        <p class="count-label">Lần thứ</p>
        <p class="count-num"   id="ev-n">26</p>
        <p class="range"       id="ev-range">18/09/2000 – 18/09/2026</p>
      </div>

    </div>
  </div>
</div>

<script>
  /* ── Đọc params từ URL ── */
  function getParams() {
    var p = new URLSearchParams(window.location.search);
    return {
      day:        p.get('day')        || '18',
      month:      p.get('month')      || '9',
      year:       p.get('year')       || '2000',
      title_name: p.get('title_name') || p.get('name') || 'An Nhiên',
      photo_url:  p.get('photo_url')  || p.get('photoUrl') || ''
    };
  }

  var data = getParams();

  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  function parseSheetDate(d, m, y) {
    var dd = parseInt(d, 10);
    var mm = parseInt(m, 10);
    var yy = parseInt(y, 10);
    if (isNaN(dd) || isNaN(mm) || isNaN(yy))
      return { ok: false, msg: 'Ngày/tháng/năm không hợp lệ' };
    if (mm < 1 || mm > 12)
      return { ok: false, msg: 'Tháng phải từ 1 đến 12' };
    if (dd < 1 || dd > 31)
      return { ok: false, msg: 'Ngày phải từ 1 đến 31' };
    if (yy < 1900 || yy > 2100)
      return { ok: false, msg: 'Năm không hợp lý (' + yy + ')' };
    var probe = new Date(yy, mm - 1, dd);
    if (probe.getMonth() !== mm - 1 || probe.getDate() !== dd)
      return { ok: false, msg: pad(dd) + '/' + pad(mm) + '/' + yy + ' không tồn tại' };
    return { ok: true, day: dd, month: mm, year: yy };
  }

  (function render() {
    var result = parseSheetDate(data.day, data.month, data.year);
    if (!result.ok) {
      document.getElementById('ev-name').textContent  = '⚠ Lỗi dữ liệu';
      document.getElementById('ev-n').textContent     = '--';
      document.getElementById('ev-range').textContent = result.msg;
      return;
    }
    var currentYear = new Date().getFullYear();
    var N = Math.max(0, currentYear - result.year);
    var birthStr   = pad(result.day) + '/' + pad(result.month) + '/' + result.year;
    var todayBirth = pad(result.day) + '/' + pad(result.month) + '/' + currentYear;

    if (data.photo_url && data.photo_url.trim() !== '') {
      document.getElementById('ev-photo').src = data.photo_url;
    }
    document.getElementById('ev-name').textContent  = data.title_name || '---';
    document.getElementById('ev-n').textContent     = N;
    document.getElementById('ev-range').textContent = birthStr + ' – ' + todayBirth;
  })();
</script>

</html>
